server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routes such as /holds/<id> are handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Must never be cached: it holds the API address set at container start.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built files have a content hash in their name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
